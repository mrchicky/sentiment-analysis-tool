[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis-tool"
version = "0.1.0"
description = "A lightweight sentiment analysis web app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Muhammad Umer" }
]

[tool.setuptools.packages.find]
where = ["src"]
